<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        html,
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }

        .theia-preload {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: none;
        }

        .theia-preload::after {
            content: none;
        }

        .spinner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .logo-wrapper {
            position: relative;
            width: 180px;
            height: 240px;
        }

        .logo-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 180px;
            height: 180px;
        }

        .logo-hat {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 0px;
            left: 15px;
            transform-origin: center 75%;
            animation: hat-toss 3s ease-in-out infinite;
        }

        @keyframes hat-toss {
            0% {
                transform: translate(0, 0) rotate(0deg);
                animation-timing-function: cubic-bezier(0.3, 0, 0.1, 1);
            }
            28% {
                transform: translate(18px, -60px) rotate(14deg);
                animation-timing-function: cubic-bezier(0.9, 0, 0.7, 0.3);
            }
            56% {
                transform: translate(0px, 0px) rotate(0deg);
                animation-timing-function: ease-out;
            }
            62% {
                transform: translate(0px, -10px) rotate(-2deg);
            }
            68% {
                transform: translate(0px, 0px) rotate(0deg);
            }
            100% {
                transform: translate(0px, 0px) rotate(0deg);
            }
        }
    </style>
</head>
