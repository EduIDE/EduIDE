name: Build and Push Theia Images

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  schedule:
    - cron: '0 2 * * *'

  # Called by release.yml, which passes the release version as image_tag.
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag, e.g. 2.3.0 (no leading v)"
        required: false
        default: ""
        type: string
      disable_layer_cache:
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (e.g. my-test-tag, or 2.3.0 for the release train)"
        required: false
        default: ""
        type: string
      disable_layer_cache:
        description: "Disable the Docker layer cache (--no-cache) for stress testing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # The base IDE image every language image is built FROM. Its immutable
  # sha_tag is passed down so the language images cannot pick up a different
  # base than the one just built.
  base:
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: images/base-ide/BaseDockerfile
      image-name: eduide/eduide/base
      docker-context: .
      # release.yml passes the version here, without a leading v. An override
      # is used verbatim by the shared workflow, so a `v1.2.0` would be
      # published as `v1.2.0` - a tag no chart can consume, since appVersion
      # and the image tag must be one string. Without it, a run on main would
      # derive `latest`.
      image-tag: ${{ inputs.image_tag || '' }}
      build-args: |
        IMAGE_NAME=eduide/eduide/base
        IMAGE_REVISION=${{ github.sha }}
      # Bakes APP_VERSION=<derived tag> into the image, which the About dialog
      # reads back so a running session can name the image it came from.
      stamp-app-version: true
      no-cache: ${{ github.event_name == 'schedule' || inputs.disable_layer_cache || false }}
    secrets: inherit

  images:
    needs: base
    name: ${{ matrix.image-name }}
    strategy:
      # These are large, independent images. One language failing to build must
      # not cancel the other thirteen.
      fail-fast: false
      matrix:
        include:
          - image-name: eduide/eduide/c
            docker-file: images/c/ToolDockerfile
          - image-name: eduide/eduide/c-templates
            docker-file: images/c-templates/ToolDockerfile
          - image-name: eduide/eduide/java-17
            docker-file: images/java-17/ToolDockerfile
          - image-name: eduide/eduide/java-17-templates
            docker-file: images/java-17-templates/ToolDockerfile
          - image-name: eduide/eduide/java-25
            docker-file: images/java-25/ToolDockerfile
          - image-name: eduide/eduide/java-25-templates
            docker-file: images/java-25-templates/ToolDockerfile
          - image-name: eduide/eduide/thm-java-25
            docker-file: images/thm-java-25/ToolDockerfile
          - image-name: eduide/eduide/javascript
            docker-file: images/javascript/ToolDockerfile
          - image-name: eduide/eduide/python
            docker-file: images/python/ToolDockerfile
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: ${{ matrix.docker-file }}
      image-name: ${{ matrix.image-name }}
      docker-context: .
      build-args: |
        BASE_IDE_TAG=${{ needs.base.outputs.sha_tag }}
        IMAGE_NAME=${{ matrix.image-name }}
        IMAGE_REVISION=${{ github.sha }}
      # See the note on the base job.
      stamp-app-version: true
      # See the note on the base job.
      image-tag: ${{ inputs.image_tag || '' }}
      no-cache: ${{ github.event_name == 'schedule' || inputs.disable_layer_cache || false }}
    secrets: inherit
