# Manual release, the only way this repository releases.
#
#   gh workflow run release.yml -f version=1.6.0
#
# The release pull request (CHANGELOG.md section) is merged first, see
# .claude/skills/release/SKILL.md. A Release created with GITHUB_TOKEN triggers
# no other workflow, so the image build is called from here.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.6.0 or 1.6.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: EduIDE/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"

  images:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      # Passed explicitly: without it the shared build workflow derives `latest`.
      image_tag: ${{ inputs.version }}
    secrets: inherit

  verify:
    needs: [release, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Every image exists for amd64 and arm64
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          names=$( { echo eduide/eduide/base; yq -r '.jobs.images.strategy.matrix.include[].image-name' .github/workflows/build.yml; } )
          for name in $names; do
            archs=$(docker buildx imagetools inspect "ghcr.io/${name}:${VERSION}" --raw | jq -r '[.manifests[].platform.architecture] | join(",")')
            echo "${name}:${VERSION} -> ${archs}"
            [[ "$archs" == *amd64* && "$archs" == *arm64* ]] || { echo "::error::${name}:${VERSION} is missing amd64 or arm64 (${archs})"; exit 1; }
          done

      - name: Summary
        run: |
          echo "## Released ${{ needs.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
