# NOTE: the published images bind the Theia backend to 127.0.0.1 (loopback only);
# in production only the in-pod oauth2-proxy sidecar reaches it. Docker port
# forwarding cannot reach a loopback-only bind, so for LOCAL testing each service
# below overrides the hostname back to 0.0.0.0. Do not copy this override into k8s.
services:
  base-ide:
    image: theia-base:local
    build:
      context: .
      dockerfile: images/base-ide/BaseDockerfile
    ports:
      - "3000:3000"


  base-standalone:
    image: theia-base-standalone:local
    build:
      context: .
      dockerfile: images/base-standalone/Dockerfile
      args:
        BASE_IMAGE: theia-base:local
      additional_contexts:
        base-ide: "service:base-ide"
    depends_on:
      - base-ide

  base-artemis:
    image: theia-base-artemis:local
    build:
      context: .
      dockerfile: images/base-artemis/Dockerfile
      args:
        BASE_IMAGE: theia-base:local
      additional_contexts:
        base-ide: "service:base-ide"
    depends_on:
      - base-ide

  haskell:
    image: theia-haskell:local
    build:
      context: .
      dockerfile: images/haskell/ToolDockerfile
      args:
        BASE_IMAGE: theia-base:local
      additional_contexts:
        base-ide: "service:base-ide"
    depends_on:
      - base-ide
    ports:
      - "3002:3000"
    command: [ "/home/project", "--hostname=0.0.0.0" ]


  ocaml:
